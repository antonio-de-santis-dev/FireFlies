# Verifica delle immagini di produzione (FASE 8): build di backend e sito con i Dockerfile, NESSUN push e nessun deploy.
name: images
on:
  push:
    branches: ['fase-8/**', 'fix-*', 'fix2/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Immagine del backend
        run: docker build -t fireflies-backend:ci backend
      - name: Immagine del sito (Caddy)
        run: docker build -t fireflies-web:ci frontend
      - name: Nessun segreto nelle immagini
        run: |
          for img in fireflies-backend:ci fireflies-web:ci; do
            docker run --rm --entrypoint sh "$img" -c 'find / -xdev \( -name "*.env" -o -name ".env*" \) -not -path "/proc/*" 2>/dev/null' | tee /tmp/found
            test ! -s /tmp/found
          done
      - name: Configurazione di Caddy valida
        run: docker run --rm -e FIREFLIES_DOMAIN=example.invalid -e FIREFLIES_ACME_EMAIL=ops@example.invalid -e FIREFLIES_MEDIA_ORIGIN=https://media.example.invalid fireflies-web:ci caddy validate --config /etc/caddy/Caddyfile
      - name: Utente non root nel backend
        run: test "$(docker run --rm --entrypoint id fireflies-backend:ci -u)" != "0"
