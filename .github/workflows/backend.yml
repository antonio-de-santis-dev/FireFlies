# CI minima del backend: unità + integrazione su PostgreSQL 17 reale (Testcontainers usa il Docker del runner).
name: backend

on:
  push:
    branches: ["main", "fase-*/**"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test unitari e di integrazione
        run: ./mvnw -B verify
      - name: Report dei test
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 14
