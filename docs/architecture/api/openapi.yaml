openapi: 3.1.0
info:
  title: FireFlies Aperitif API
  license:
    name: Proprietario — uso riservato
    identifier: LicenseRef-Proprietary
  version: 1.0.0-draft.4
  summary: Contratto V1. Implementati autenticazione (FASE 3), menu, foto, contenuti e avvisi (FASE 4); prenotazioni in bozza.
  description: |
    Autenticazione, menu, foto, contenuti del sito e avvisi sono implementati e verificati dai test.
    Le prenotazioni restano bozza di progettazione fino alla FASE 5; gli altri endpoint sono in API_CONTRACT.md.
    Orari locali in Europe/Rome. Errori in application/problem+json.
servers:
  - url: /api/v1
tags:
  - name: public
    description: Sito pubblico, senza autenticazione
  - name: auth
    description: Accesso dei gestori
  - name: admin-reservations
    description: Gestione prenotazioni (STAFF e OWNER)
  - name: admin-menu
    description: Menu, prezzi e allergeni (STAFF e OWNER)
  - name: admin-media
    description: Libreria foto (STAFF e OWNER)
  - name: admin-content
    description: Testi, titolari, staff, testata del menu, orari e contatti (solo OWNER); avvisi (STAFF e OWNER)
security: []

paths:
  /public/booking-options:
    get:
      tags: [public]
      operationId: getBookingOptions
      summary: Fasce e slot prenotabili di un giorno
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: eventId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: guests, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 2 } }
      responses:
        '200':
          description: Opzioni del giorno
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingOptions' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /public/reservations:
    post:
      tags: [public]
      operationId: createPublicReservation
      summary: Invia una richiesta di prenotazione (stato PENDING)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicReservationRequest' }
      responses:
        '201':
          description: Richiesta creata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicReservationReceipt' }
        '200':
          description: Ripetizione con la stessa Idempotency-Key e gli stessi dati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicReservationReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: Ottiene il token CSRF
      responses:
        '200':
          description: Token CSRF (anche nel cookie XSRF-TOKEN)
          content:
            application/json:
              schema:
                type: object
                required: [headerName, cookieName]
                properties:
                  headerName: { type: string, const: X-XSRF-TOKEN }
                  cookieName: { type: string, const: XSRF-TOKEN }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Accesso gestori
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Autenticato; imposta il cookie di sessione
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Stato della sessione (sempre 200)
      responses:
        '200':
          description: Autenticato oppure no; reason SESSION_EXPIRED se la sessione presentata non è più valida
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated: { type: boolean }
                  user: { oneOf: [ { $ref: '#/components/schemas/CurrentUser' }, { type: 'null' } ] }
                  reason: { type: [string, 'null'], enum: [SESSION_EXPIRED, null] }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Uscita
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204': { description: Sessione chiusa }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/me:
    get:
      tags: [auth]
      operationId: me
      summary: Utente corrente
      security: [{ session: [] }]
      responses:
        '200':
          description: Utente corrente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /public/site:
    get:
      tags: [public]
      operationId: getPublicSite
      summary: Contenuti del sito pubblico (impostazioni, orari, testi, titolari e staff visibili, avvisi attivi)
      responses:
        '200':
          description: Sito pubblico (ETag, Cache-Control public max-age=60)
          content:
            application/json:
              schema:
                type: object
                required: [settings, content, announcements, demoContent]
                properties:
                  settings: { $ref: '#/components/schemas/SiteSettings' }
                  content: { $ref: '#/components/schemas/SiteContent' }
                  announcements: { type: array, items: { $ref: '#/components/schemas/Announcement' } }
                  demoContent: { type: boolean, description: true solo con dati dimostrativi (sviluppo locale) }
        '304': { description: Invariato (If-None-Match) }
        '406': { description: Formato richiesto non disponibile (Accept) }

  /public/menu:
    get:
      tags: [public]
      operationId: getPublicMenu
      summary: Menu pubblico (solo categorie e voci visibili)
      responses:
        '200':
          description: Menu (ETag, Cache-Control public max-age=60)
          content:
            application/json:
              schema:
                type: object
                required: [categories, allergens]
                properties:
                  categories:
                    type: array
                    items:
                      type: object
                      required: [slug, name, items]
                      properties:
                        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
                        name: { type: string }
                        hint: { type: [string, 'null'] }
                        items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
                  allergens: { type: array, items: { $ref: '#/components/schemas/Allergen' } }
        '304': { description: Invariato (If-None-Match) }
        '406': { description: Formato richiesto non disponibile (Accept) }

  /public/gallery:
    get:
      tags: [public]
      operationId: getPublicGallery
      summary: Foto della galleria nell'ordine scelto dai gestori
      responses:
        '200':
          description: Galleria (ETag, Cache-Control public max-age=300)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MediaRef' } }
        '406': { description: Formato richiesto non disponibile (Accept) }

  /admin/menu:
    get:
      tags: [admin-menu]
      operationId: getAdminMenu
      summary: Menu completo per i gestori (anche voci e categorie nascoste)
      security: [{ session: [] }]
      responses:
        '200':
          description: Menu
          content:
            application/json:
              schema:
                type: object
                required: [categories, items, allergens]
                properties:
                  categories: { type: array, items: { $ref: '#/components/schemas/MenuCategory' } }
                  items: { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
                  allergens: { type: array, items: { $ref: '#/components/schemas/Allergen' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /admin/menu/categories:
    post:
      tags: [admin-menu]
      operationId: createMenuCategory
      summary: Nuova categoria (slug dal nome se assente)
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuCategoryRequest' } } }
      responses:
        '201': { description: Creata, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCategory' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/menu/categories/{id}:
    parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
    put:
      tags: [admin-menu]
      operationId: updateMenuCategory
      summary: Modifica una categoria (lo slug resta se non indicato)
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuCategoryRequest' } } }
      responses:
        '200': { description: Aggiornata, content: { application/json: { schema: { $ref: '#/components/schemas/MenuCategory' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-menu]
      operationId: deleteMenuCategory
      summary: Elimina una categoria vuota
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '204': { description: Eliminata }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/menu/items:
    post:
      tags: [admin-menu]
      operationId: createMenuItem
      summary: Nuova voce del menu
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemRequest' } } }
      responses:
        '201': { description: Creata, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/menu/items/{id}:
    parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
    put:
      tags: [admin-menu]
      operationId: updateMenuItem
      summary: Modifica una voce (version obbligatoria)
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MenuItemRequest' } } }
      responses:
        '200': { description: Aggiornata, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [admin-menu]
      operationId: deleteMenuItem
      summary: Elimina una voce
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '204': { description: Eliminata }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/menu/items/{id}/visibility:
    parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
    patch:
      tags: [admin-menu]
      operationId: setMenuItemVisibility
      summary: Mostra o nasconde una voce sul sito
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, visible]
              properties:
                version: { type: integer }
                visible: { type: boolean }
      responses:
        '200': { description: Aggiornata, content: { application/json: { schema: { $ref: '#/components/schemas/MenuItem' } } } }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/media:
    get:
      tags: [admin-media]
      operationId: getMediaLibrary
      summary: Libreria foto con usi
      security: [{ session: [] }]
      responses:
        '200': { description: Libreria, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin-media]
      operationId: uploadMedia
      summary: Carica una foto (verificata e ricodificata dal backend, max 5 MB)
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, altText]
              properties:
                file: { type: string, format: binary, description: 'JPEG, PNG o WebP' }
                altText: { type: string, minLength: 5, maxLength: 250 }
                credit: { type: string, maxLength: 120 }
      responses:
        '201': { description: Pronta, content: { application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } } } }
        '413': { description: Oltre 5 MB (MEDIA_TOO_LARGE), content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { description: 'Storage non raggiungibile (SERVICE_UNAVAILABLE, Retry-After)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }

  /admin/media/order:
    put:
      tags: [admin-media]
      operationId: reorderMedia
      summary: Ordine della libreria e della galleria
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaIds]
              properties:
                mediaIds: { type: array, maxItems: 2000, items: { type: string, format: uuid } }
      responses:
        '200': { description: Libreria riordinata, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MediaAsset' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/media/{id}:
    parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
    patch:
      tags: [admin-media]
      operationId: updateMedia
      summary: Testo alternativo, crediti, presenza in galleria
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                altText: { type: string, minLength: 5, maxLength: 250 }
                credit: { type: string, maxLength: 120 }
                inGallery: { type: boolean }
      responses:
        '200': { description: Aggiornata, content: { application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
    delete:
      tags: [admin-media]
      operationId: deleteMedia
      summary: Elimina una foto non usata
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '204': { description: Eliminata (i file nello storage vengono cancellati dopo il commit) }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/media/{id}/file:
    parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
    put:
      tags: [admin-media]
      operationId: replaceMediaFile
      summary: Sostituisce il file mantenendo id, testo alternativo e usi
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Sostituita, content: { application/json: { schema: { $ref: '#/components/schemas/MediaAsset' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/site-content:
    get:
      tags: [admin-content]
      operationId: getSiteContent
      summary: Testi, sezioni, titolari, staff e testata del menu (solo OWNER)
      security: [{ session: [] }]
      responses:
        '200': { description: Contenuti, content: { application/json: { schema: { $ref: '#/components/schemas/SiteContent' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin-content]
      operationId: updateSiteContent
      summary: Salva e pubblica tutti i contenuti insieme (solo OWNER)
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SiteContentRequest' } } }
      responses:
        '200': { description: Pubblicati, content: { application/json: { schema: { $ref: '#/components/schemas/SiteContent' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/site-settings:
    get:
      tags: [admin-content]
      operationId: getSiteSettings
      summary: Indirizzo, contatti, mappa e orari (solo OWNER)
      security: [{ session: [] }]
      responses:
        '200': { description: Impostazioni, content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettings' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin-content]
      operationId: updateSiteSettings
      summary: Salva impostazioni e orari dei 7 giorni (solo OWNER)
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettings' } } }
      responses:
        '200': { description: Salvate, content: { application/json: { schema: { $ref: '#/components/schemas/SiteSettings' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/announcements:
    get:
      tags: [admin-content]
      operationId: getAnnouncements
      summary: Avvisi (anche nascosti e scaduti)
      security: [{ session: [] }]
      responses:
        '200': { description: Avvisi, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Announcement' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin-content]
      operationId: createAnnouncement
      summary: Nuovo avviso
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementRequest' } } }
      responses:
        '201': { description: Creato, content: { application/json: { schema: { $ref: '#/components/schemas/Announcement' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/announcements/{id}:
    parameters: [ { $ref: '#/components/parameters/ResourceId' } ]
    put:
      tags: [admin-content]
      operationId: updateAnnouncement
      summary: Modifica, mostra o nasconde un avviso
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnnouncementRequest' } } }
      responses:
        '200': { description: Aggiornato, content: { application/json: { schema: { $ref: '#/components/schemas/Announcement' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin-content]
      operationId: deleteAnnouncement
      summary: Elimina un avviso
      security: [{ session: [] }]
      parameters: [ { $ref: '#/components/parameters/CsrfHeader' } ]
      responses:
        '204': { description: Eliminato }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/reservations:
    get:
      tags: [admin-reservations]
      operationId: listReservations
      summary: Elenco prenotazioni filtrato
      security: [{ session: [] }]
      parameters:
        - { name: dateFrom, in: query, schema: { type: string, format: date } }
        - { name: dateTo, in: query, schema: { type: string, format: date } }
        - { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/ReservationStatus' } }, style: form, explode: false }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/ReservationSource' } }
        - { name: eventId, in: query, schema: { type: string, format: uuid } }
        - { name: needsCallback, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string, maxLength: 80 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Pagina di prenotazioni
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalItems]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Reservation' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalItems: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [admin-reservations]
      operationId: createManualReservation
      summary: Inserimento da telefono o email
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualReservationRequest' }
      responses:
        '201':
          description: Creata (PENDING o CONFIRMED se confirmNow)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/reservations/{id}:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    get:
      tags: [admin-reservations]
      operationId: getReservation
      summary: Dettaglio prenotazione
      security: [{ session: [] }]
      responses:
        '200':
          description: Dettaglio con storico
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservationDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin-reservations]
      operationId: updateReservation
      summary: Modifica data, ora, persone, note (ricontrolla capienza e tavoli se CONFIRMED)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservationUpdate' }
      responses:
        '200':
          description: Aggiornata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/reservations/{id}/status:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    patch:
      tags: [admin-reservations]
      operationId: changeReservationStatus
      summary: Transizione di stato (idempotente)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusChange' }
      responses:
        '200':
          description: Stato cambiato, oppure già nello stato richiesto (nessun effetto)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/reservations/{id}/tables:
    parameters:
      - $ref: '#/components/parameters/ReservationId'
    put:
      tags: [admin-reservations]
      operationId: assignTables
      summary: Assegnazione manuale (sostituisce l'elenco)
      security: [{ session: [] }]
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, tableIds]
              additionalProperties: false
              properties:
                version: { type: integer }
                tableIds: { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
                overrideSeats: { type: boolean, default: false, description: Solo OWNER; consente posti tavolo inferiori alle persone }
                overrideReason: { type: [string, 'null'], maxLength: 200 }
      responses:
        '200':
          description: Tavoli aggiornati
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Reservation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /admin/capacity:
    get:
      tags: [admin-reservations]
      operationId: getCapacity
      summary: Occupazione del giorno per zona, quanto per quanto, e quote eventi
      security: [{ session: [] }]
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
        - { name: zoneId, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Situazione coperti del giorno
          content:
            application/json:
              schema:
                type: object
                required: [date, zones, events]
                properties:
                  date: { type: string, format: date }
                  zones:
                    type: array
                    items:
                      type: object
                      required: [zoneId, name, physicalCapacity, slots]
                      properties:
                        zoneId: { type: string, format: uuid }
                        name: { type: string }
                        physicalCapacity: { type: integer, minimum: 0 }
                        slots:
                          type: array
                          description: Quanti da 15 minuti del giorno di servizio
                          items:
                            type: object
                            required: [start, capacityCovers, occupiedCovers, pendingCovers, freeCovers]
                            properties:
                              start: { type: string, format: date-time }
                              capacityCovers: { type: integer, minimum: 0 }
                              occupiedCovers: { type: integer, minimum: 0 }
                              pendingCovers: { type: integer, minimum: 0 }
                              freeCovers: { type: integer, minimum: 0 }
                              exclusiveEventId: { type: [string, 'null'], format: uuid }
                  events:
                    type: array
                    items:
                      type: object
                      required: [eventId, title, exclusive, capacityCovers, confirmedCovers]
                      properties:
                        eventId: { type: string, format: uuid }
                        title: { type: string }
                        zoneId: { type: [string, 'null'], format: uuid }
                        exclusive: { type: boolean }
                        capacityCovers: { type: integer, minimum: 0 }
                        confirmedCovers: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: FF_SESSION

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
    CsrfHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema: { type: string }
    ReservationId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Richiesta malformata
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Non autenticato
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Permesso negato o CSRF non valido
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Non trovato
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: Conflitto con lo stato attuale (capienza, tavolo, versione, transizione, duplicato)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Dati non accettabili per le regole
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    TooManyRequests:
      description: Limite di frequenza superato
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    ReservationStatus:
      type: string
      enum: [PENDING, CONFIRMED, REJECTED, CANCELLED, COMPLETED, NO_SHOW]
    ReservationSource:
      type: string
      enum: [WEB, PHONE, EMAIL]
    StatusReason:
      type: string
      enum: [EXPIRED, NO_CAPACITY, CUSTOMER_REQUEST, VENUE_DECISION, EVENT_CANCELLED, DUPLICATE, OTHER]
    LocalTime:
      type: string
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    DurationMinutes:
      type: integer
      minimum: 30
      maximum: 360
      multipleOf: 15
      description: Durata dell'occupazione; default la durata standard della fascia
    Phone:
      type: string
      description: Numero di telefono; il server lo normalizza in E.164 (+39 per numeri italiani senza prefisso).
      minLength: 6
      maxLength: 20

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, examples: [CAPACITY_EXCEEDED] }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
        context: { type: object, additionalProperties: true }

    BookingOptions:
      type: object
      required: [date, webBookingEnabled, maxPartySize, windows]
      properties:
        date: { type: string, format: date }
        webBookingEnabled: { type: boolean }
        maxPartySize: { type: integer }
        message: { type: string }
        windows:
          type: array
          items:
            type: object
            required: [name, slots]
            properties:
              windowId: { type: [string, 'null'], format: uuid }
              eventId: { type: [string, 'null'], format: uuid }
              name: { type: string }
              slots:
                type: array
                items:
                  type: object
                  required: [time, state]
                  properties:
                    time: { $ref: '#/components/schemas/LocalTime' }
                    state: { type: string, enum: [OPEN, FULL, CLOSED, EVENT, TOO_EARLY] }

    CustomerInput:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        phone: { $ref: '#/components/schemas/Phone' }
        email: { type: [string, 'null'], format: email, maxLength: 254 }

    PublicReservationRequest:
      type: object
      required: [date, time, guestCount, customer, privacyNoticeVersion, privacyAcknowledged]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        time: { $ref: '#/components/schemas/LocalTime' }
        guestCount: { type: integer, minimum: 1, maximum: 50 }
        eventId: { type: [string, 'null'], format: uuid }
        areaPreferenceId: { type: [string, 'null'], format: uuid }
        customer: { $ref: '#/components/schemas/CustomerInput' }
        notes: { type: [string, 'null'], maxLength: 500 }
        privacyNoticeVersion: { type: string, maxLength: 20 }
        privacyAcknowledged: { type: boolean, const: true }
        website: { type: string, maxLength: 0, description: 'Campo trappola anti-bot: deve restare vuoto' }

    PublicReservationReceipt:
      type: object
      required: [publicRef, status, date, time, guestCount, message]
      properties:
        publicRef: { type: string, examples: [FF-7K3Q9M] }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        date: { type: string, format: date }
        time: { $ref: '#/components/schemas/LocalTime' }
        guestCount: { type: integer }
        message: { type: string }

    ManualReservationRequest:
      type: object
      required: [source, date, time, guestCount, customer]
      additionalProperties: false
      properties:
        source: { type: string, enum: [PHONE, EMAIL] }
        date: { type: string, format: date }
        time: { $ref: '#/components/schemas/LocalTime' }
        guestCount: { type: integer, minimum: 1, maximum: 50 }
        eventId: { type: [string, 'null'], format: uuid }
        customer: { $ref: '#/components/schemas/CustomerInput' }
        notes: { type: [string, 'null'], maxLength: 500 }
        internalNote: { type: [string, 'null'], maxLength: 500 }
        durationMinutes: { $ref: '#/components/schemas/DurationMinutes' }
        zoneId: { type: [string, 'null'], format: uuid }
        confirmNow: { type: boolean, default: false }
        tableIds: { type: array, maxItems: 6, uniqueItems: true, items: { type: string, format: uuid } }
        overrideSeats: { type: boolean, default: false, description: Solo OWNER }
        overrideReason: { type: [string, 'null'], maxLength: 200 }

    ReservationUpdate:
      type: object
      required: [version]
      additionalProperties: false
      properties:
        version: { type: integer }
        date: { type: string, format: date }
        time: { $ref: '#/components/schemas/LocalTime' }
        guestCount: { type: integer, minimum: 1, maximum: 50 }
        durationMinutes: { $ref: '#/components/schemas/DurationMinutes' }
        zoneId: { type: string, format: uuid }
        notes: { type: [string, 'null'], maxLength: 500 }
        internalNote: { type: [string, 'null'], maxLength: 500 }
        needsCallback: { type: boolean }

    StatusChange:
      type: object
      required: [version, status]
      additionalProperties: false
      properties:
        version: { type: integer }
        status: { type: string, enum: [CONFIRMED, REJECTED, CANCELLED, COMPLETED, NO_SHOW] }
        reason: { oneOf: [ { $ref: '#/components/schemas/StatusReason' }, { type: 'null' } ] }
        note: { type: [string, 'null'], maxLength: 300 }
        zoneId:
          description: Solo con status CONFIRMED; obbligatorio se il locale ha più zone e la richiesta non ne indica una
          type: [string, 'null']
          format: uuid
        overrideSeats: { type: boolean, default: false, description: Solo OWNER; posti tavolo inferiori alle persone }
        overrideReason: { type: [string, 'null'], maxLength: 200 }
        tableIds:
          description: Solo con status CONFIRMED; assegnazione manuale facoltativa nella stessa transazione
          type: array
          maxItems: 6
          uniqueItems: true
          items: { type: string, format: uuid }

    Reservation:
      type: object
      required: [id, publicRef, status, version, source, date, time, endTime, guestCount, customer, needsCallback, tables, notifications, warnings]
      properties:
        id: { type: string, format: uuid }
        publicRef: { type: string }
        status: { $ref: '#/components/schemas/ReservationStatus' }
        statusReason: { oneOf: [ { $ref: '#/components/schemas/StatusReason' }, { type: 'null' } ] }
        version: { type: integer }
        source: { $ref: '#/components/schemas/ReservationSource' }
        date: { type: string, format: date }
        time: { $ref: '#/components/schemas/LocalTime' }
        endTime: { $ref: '#/components/schemas/LocalTime' }
        occupiedUntil:
          description: Fine effettiva dell'occupazione (anticipata da uscita anticipata o no-show); null se non confermata
          oneOf: [ { $ref: '#/components/schemas/LocalTime' }, { type: 'null' } ]
        guestCount: { type: integer }
        customer:
          type: object
          required: [name]
          properties:
            name: { type: string }
            phone: { type: [string, 'null'] }
            email: { type: [string, 'null'] }
        notes: { type: [string, 'null'] }
        internalNote: { type: [string, 'null'] }
        needsCallback: { type: boolean }
        zone:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        window:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        event:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
        tables:
          type: array
          items:
            type: object
            required: [id, code, area, maxSeats]
            properties:
              id: { type: string, format: uuid }
              code: { type: string }
              area: { type: string }
              maxSeats: { type: integer }
              seatsOverride: { type: boolean }
        notifications:
          type: array
          items:
            type: object
            required: [channel, state]
            properties:
              channel: { type: string, enum: [EMAIL, SMS] }
              state: { type: string, enum: [PENDING, SENDING, SENT, DELIVERED, UNCERTAIN, FAILED, DEAD, SKIPPED] }
              reason: { type: [string, 'null'] }
        warnings:
          type: array
          items: { type: string, enum: [OUTSIDE_SLOTS, SHORT_NOTICE, MIN_SEATS_ABOVE_PARTY] }
        createdAt: { type: string, format: date-time }

    ReservationDetail:
      allOf:
        - $ref: '#/components/schemas/Reservation'
        - type: object
          required: [history]
          properties:
            history:
              type: array
              items:
                type: object
                required: [toStatus, changedAt]
                properties:
                  fromStatus: { oneOf: [ { $ref: '#/components/schemas/ReservationStatus' }, { type: 'null' } ] }
                  toStatus: { $ref: '#/components/schemas/ReservationStatus' }
                  reason: { type: [string, 'null'] }
                  note: { type: [string, 'null'] }
                  changedBy: { type: [string, 'null'] }
                  changedAt: { type: string, format: date-time }

    CurrentUser:
      type: object
      required: [id, email, displayName, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        role: { type: string, enum: [OWNER, STAFF] }

    MediaRef:
      type: object
      required: [id, alt, width, height, src, srcset]
      properties:
        id: { type: string, format: uuid }
        alt: { type: string }
        width: { type: integer }
        height: { type: integer }
        src: { type: string, description: variante da 960 px o la più grande disponibile }
        srcset: { type: string, example: '/media/…/w480.jpg 480w, /media/…/w960.jpg 960w' }
    MediaAsset:
      allOf:
        - $ref: '#/components/schemas/MediaRef'
        - type: object
          required: [inGallery, variants, usages]
          properties:
            credit: { type: [string, 'null'] }
            originalMimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
            originalBytes: { type: integer }
            inGallery: { type: boolean }
            galleryOrder: { type: [integer, 'null'] }
            variants:
              type: array
              items:
                type: object
                properties:
                  size: { type: string, enum: [W480, W960, W1600] }
                  width: { type: integer }
                  height: { type: integer }
                  mimeType: { type: string, enum: [image/jpeg, image/png] }
                  bytes: { type: integer }
                  url: { type: string }
            usages:
              type: array
              items:
                type: object
                properties:
                  type: { type: string, example: MENU_ITEM }
                  label: { type: string, example: 'menu «Tagliere FireFlies»' }
            createdAt: { type: string, format: date-time }
    Allergen:
      type: object
      required: [code, name]
      properties:
        code: { type: string, enum: [GLUTEN, CRUSTACEANS, EGGS, FISH, PEANUTS, SOYBEANS, MILK, NUTS, CELERY, MUSTARD, SESAME, SULPHITES, LUPIN, MOLLUSCS] }
        name: { type: string, example: Glutine }
    MenuCategory:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string, maxLength: 40 }
        hint: { type: [string, 'null'], maxLength: 80 }
        sortOrder: { type: integer }
        visible: { type: boolean }
        itemCount: { type: integer }
    MenuCategoryRequest:
      type: object
      required: [name, visible]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 40 }
        name: { type: string, minLength: 1, maxLength: 40 }
        hint: { type: string, maxLength: 80 }
        visible: { type: boolean }
    MenuItem:
      type: object
      required: [id, name, ingredients, priceCents, allergens]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid, description: solo area gestori }
        categorySlug: { type: string, description: solo area gestori }
        name: { type: string }
        description: { type: [string, 'null'] }
        ingredients: { type: array, items: { type: string } }
        priceCents: { type: [integer, 'null'], minimum: 0, maximum: 100000, description: null = «Prezzo da definire» }
        demoPriceCents: { type: [integer, 'null'], description: prezzo DIMOSTRATIVO (solo dati demo locali) }
        allergens:
          type: object
          required: [declared, codes]
          properties:
            declared: { type: boolean, description: false = «da dichiarare» }
            codes: { type: array, items: { type: string } }
            verifiedAt: { type: [string, 'null'], format: date-time }
        photo: { oneOf: [ { $ref: '#/components/schemas/MediaRef' }, { type: 'null' } ] }
        visible: { type: boolean, description: solo area gestori }
        version: { type: integer, description: solo area gestori }
    MenuItemRequest:
      type: object
      required: [categoryId, name, allergens, visible]
      additionalProperties: false
      properties:
        version: { type: integer, description: obbligatoria in modifica }
        categoryId: { type: string, format: uuid }
        name: { type: string, minLength: 2, maxLength: 80 }
        description: { type: string, maxLength: 400 }
        ingredients: { type: array, maxItems: 20, items: { type: string, maxLength: 60, pattern: '^[^,]*$' } }
        priceCents: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
        allergens:
          type: object
          required: [declared, codes]
          properties:
            declared: { type: boolean }
            codes: { type: array, maxItems: 14, items: { type: string } }
        photoMediaId: { type: [string, 'null'], format: uuid }
        visible: { type: boolean }
    Owner:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        roleLabel: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        motto: { type: [string, 'null'] }
        color: { type: [string, 'null'], enum: [giallo, arancio, verde, null] }
        front: { oneOf: [ { $ref: '#/components/schemas/MediaRef' }, { type: 'null' } ] }
        back: { oneOf: [ { $ref: '#/components/schemas/MediaRef' }, { type: 'null' } ] }
        visible: { type: boolean }
    StaffMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        roleLabel: { type: [string, 'null'] }
        photo: { oneOf: [ { $ref: '#/components/schemas/MediaRef' }, { type: 'null' } ] }
        visible: { type: boolean }
    SiteContent:
      type: object
      properties:
        version: { type: integer }
        heroClaim: { type: [string, 'null'] }
        heroLead: { type: [string, 'null'] }
        heroPhoto: { oneOf: [ { $ref: '#/components/schemas/MediaRef' }, { type: 'null' } ] }
        sections: { type: object, additionalProperties: { type: boolean }, example: { momento: true, eventi: false } }
        storyTitle: { type: [string, 'null'] }
        storyText: { type: [string, 'null'] }
        storyConfirmed: { type: boolean }
        owners: { type: array, items: { $ref: '#/components/schemas/Owner' } }
        ownersConfirmed: { type: boolean }
        staff: { type: array, items: { $ref: '#/components/schemas/StaffMember' } }
        staffConfirmed: { type: boolean }
        menuHero:
          type: object
          properties:
            photos: { type: array, items: { $ref: '#/components/schemas/MediaRef' } }
            intervalSec: { type: integer, minimum: 10, maximum: 600 }
    SiteContentRequest:
      type: object
      required: [version, storyConfirmed, ownersConfirmed, staffConfirmed, menuHeroIntervalSec]
      additionalProperties: false
      properties:
        version: { type: integer }
        heroClaim: { type: string, minLength: 3, maxLength: 120 }
        heroLead: { type: string, maxLength: 400 }
        heroMediaId: { type: [string, 'null'], format: uuid }
        sections: { type: object, additionalProperties: { type: boolean } }
        storyTitle: { type: string, maxLength: 120 }
        storyText: { type: string, maxLength: 4000 }
        storyConfirmed: { type: boolean }
        owners:
          type: array
          maxItems: 6
          items:
            type: object
            required: [name, visible]
            properties:
              id: { type: [string, 'null'], format: uuid, description: null = nuovo titolare }
              name: { type: string, maxLength: 80 }
              roleLabel: { type: string, maxLength: 80 }
              description: { type: string, maxLength: 600 }
              motto: { type: string, maxLength: 160 }
              color: { type: string, enum: [giallo, arancio, verde] }
              frontMediaId: { type: [string, 'null'], format: uuid }
              backMediaId: { type: [string, 'null'], format: uuid }
              visible: { type: boolean }
        ownersConfirmed: { type: boolean }
        staff:
          type: array
          maxItems: 12
          items:
            type: object
            required: [name, visible]
            properties:
              id: { type: [string, 'null'], format: uuid }
              name: { type: string, maxLength: 80 }
              roleLabel: { type: string, maxLength: 80 }
              mediaId: { type: [string, 'null'], format: uuid }
              visible: { type: boolean }
        staffConfirmed: { type: boolean }
        menuHeroMediaIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
        menuHeroIntervalSec: { type: integer, minimum: 10, maximum: 600 }
    SiteSettings:
      type: object
      required: [version, addressConfirmed, hoursConfirmed, hours]
      properties:
        version: { type: integer }
        addressLine: { type: [string, 'null'], minLength: 5, maxLength: 160 }
        addressConfirmed: { type: boolean }
        mapQuery: { type: [string, 'null'], maxLength: 200 }
        mapMode: { type: string, enum: [CONSENT, AUTO] }
        phone: { type: [string, 'null'], pattern: '^\+?[0-9][0-9 ]{5,18}$' }
        email: { type: [string, 'null'], format: email }
        instagramUrl: { type: [string, 'null'], pattern: '^https://(www\.)?instagram\.com/[A-Za-z0-9._]+/?$' }
        hoursConfirmed: { type: boolean }
        hours:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [isoDay, closed]
            properties:
