# Test di integrazione: il datasource arriva da Testcontainers (@ServiceConnection), mai da file.
spring:
  datasource:
    hikari:
      maximum-pool-size: 24 # i test di concorrenza aprono molte transazioni insieme

logging:
  level:
    it.fireflies: INFO
    org.testcontainers: WARN

# Sviluppo in HTTP su localhost: il cookie di sessione non può essere Secure. In prod resta Secure (application.yml).
server:
  servlet:
    session:
      cookie:
        secure: false

fireflies:
  reservations:
    expiry-sweep: PT24H # nei test la scadenza si invoca a mano
  retention:
    enabled: false # nei test la pulizia si invoca a mano
  media:
    storage: filesystem
    filesystem:
      root: ${java.io.tmpdir}/fireflies-test-media/${random.uuid}
