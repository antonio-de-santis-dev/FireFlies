# Sviluppo locale con il PostgreSQL di infra/compose.yaml.
# La password non ha valore predefinito: va impostata in infra/.env (vedi infra/.env.example).
spring:
  datasource:
    url: ${FIREFLIES_DB_URL:jdbc:postgresql://localhost:5432/fireflies}
    username: ${FIREFLIES_DB_USER:fireflies}
    password: ${FIREFLIES_DB_PASSWORD}

logging:
  level:
    it.fireflies: DEBUG

# Sviluppo in HTTP su localhost: il cookie di sessione non può essere Secure. In prod resta Secure (application.yml).
server:
  servlet:
    session:
      cookie:
        secure: false

fireflies:
  # worker delle notifiche acceso in locale: solo gateway finti, le notifiche risultano «simulate, non consegnate»
  notifications:
    worker:
      enabled: ${FIREFLIES_NOTIFICATIONS_WORKER_ENABLED:true}
  media:
    filesystem:
      root: ${FIREFLIES_MEDIA_DIR:./data/media} # ignorata da git
  # Contenuti DIMOSTRATIVI al primo avvio su database vuoto (menu con prezzi «demo», foto del mockup).
  # Il database viene marcato come demo: con il profilo prod l'avvio si rifiuta (DemoDataGuard).
  demo:
    seed: ${FIREFLIES_DEMO_SEED:true}
    assets-dir: ${FIREFLIES_DEMO_ASSETS_DIR:../frontend/public/assets/fireflies}
