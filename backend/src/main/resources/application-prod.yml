# Produzione: tutto da variabili d'ambiente / secret manager, nessun valore predefinito.
spring:
  datasource:
    url: ${FIREFLIES_DB_URL}
    username: ${FIREFLIES_DB_USER}
    password: ${FIREFLIES_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${FIREFLIES_DB_POOL_SIZE:10}

server:
  # FASE 8 (V-01): l'IP del client lo decide il RemoteIpValve di Tomcat, che si fida di X-Forwarded-For solo se la
  # richiesta arriva da un proxy interno (default: reti private e loopback, dove sta il reverse proxy nel compose) e
  # prende l'ultimo indirizzo non fidato: un client che manda un X-Forwarded-For falso non può cambiare il proprio IP.
  # Il backend non va mai esposto direttamente (porta solo sulla rete interna del compose).
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # sovrascrivibile con SERVER_TOMCAT_REMOTEIP_INTERNALPROXIES (regex Java tra apici singoli in YAML)
      internal-proxies: '10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1'
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto

logging:
  level:
    root: INFO
