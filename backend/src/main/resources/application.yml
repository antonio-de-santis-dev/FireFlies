# Configurazione comune a tutti i profili. Nessun segreto: credenziali solo da variabili d'ambiente.
spring:
  application:
    name: fireflies-backend
  profiles:
    # Senza profilo esplicito si parte in sviluppo locale; in produzione SPRING_PROFILES_ACTIVE=prod.
    default: local
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000 # millisecondi
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: false # errori gestiti da it.fireflies.common.GlobalExceptionHandler
  jackson:
    deserialization:
      fail-on-unknown-properties: true # campi non previsti (es. un "role" nel login) → 400
      accept-float-as-int: false # un prezzo 6.5 in priceCents è un errore (400), non 6 centesimi
  servlet:
    multipart:
      max-file-size: 5MB      # stesso limite di ImageProcessor e del vincolo ck_media_bytes
      max-request-size: 6MB
      file-size-threshold: 1MB
  session:
    timeout: 8h # inattività massima dei gestori (P-27)
    jdbc:
      initialize-schema: never # tabelle create da Flyway (V8)
      cleanup-cron: "0 */5 * * * *"

server:
  tomcat:
    max-swallow-size: 8MB # oltre il limite si risponde 413 invece di chiudere la connessione
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        name: FF_SESSION
        http-only: true
        same-site: lax
        secure: true # sovrascritto a false solo nei profili locali in HTTP
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

fireflies:
  security:
    login:
      max-failures-per-account: 5
      max-failures-per-ip: 20
      window: 15m
      lock-duration: 15m
  media:
    # filesystem = cartella locale (solo sviluppo e test); s3 = Cloudflare R2 / MinIO (credenziali solo da variabili)
    storage: ${FIREFLIES_MEDIA_STORAGE:filesystem}
    public-base-url: ${FIREFLIES_MEDIA_PUBLIC_URL:/media}
    s3:
      endpoint: ${FIREFLIES_S3_ENDPOINT:}
      region: ${FIREFLIES_S3_REGION:auto}
      bucket: ${FIREFLIES_S3_BUCKET:}
      access-key-id: ${FIREFLIES_S3_ACCESS_KEY_ID:}
      secret-access-key: ${FIREFLIES_S3_SECRET_ACCESS_KEY:}
  retention:
    # pulizia notturna (FASE 7): prenotazioni finite da 1 mese, eventi da 2 mesi, notifiche finali da 90 giorni,
    # audit da 12 mesi; statistiche anonime sempre conservate
    enabled: ${FIREFLIES_RETENTION_ENABLED:true}
    reservation-months: 1
    event-months: 2
    outbox-days: 90
    audit-months: 12
  notifications:
    # worker dell'outbox (FASE 7): spento per impostazione predefinita; acceso solo nel profilo local (gateway finti)
    worker:
      enabled: ${FIREFLIES_NOTIFICATIONS_WORKER_ENABLED:false}
      interval: PT30S
      batch-size: 20
      max-attempts: 5
      lease: PT2M
    sms:
      provider: fake
    email:
      provider: fake
