# Configurazione comune a tutti i profili. Nessun segreto: credenziali solo da variabili d'ambiente.
spring:
  application:
    name: fireflies-backend
  profiles:
    # Senza profilo esplicito si parte in sviluppo locale; in produzione SPRING_PROFILES_ACTIVE=prod.
    default: local
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000 # millisecondi
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  mvc:
    problemdetails:
      enabled: false # errori gestiti da it.fireflies.common.GlobalExceptionHandler
  jackson:
    deserialization:
      fail-on-unknown-properties: true # campi non previsti (es. un "role" nel login) → 400
  session:
    timeout: 8h # inattività massima dei gestori (P-27)
    jdbc:
      initialize-schema: never # tabelle create da Flyway (V8)
      cleanup-cron: "0 */5 * * * *"

server:
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        name: FF_SESSION
        http-only: true
        same-site: lax
        secure: true # sovrascritto a false solo nei profili locali in HTTP
        path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

fireflies:
  security:
    login:
      max-failures-per-account: 5
      max-failures-per-ip: 20
      window: 15m
      lock-duration: 15m
  notifications:
    sms:
      provider: fake
    email:
      provider: fake
